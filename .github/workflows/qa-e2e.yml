name: E2E QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Playwright
        run: |
          npm init -y
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 8080 > /tmp/invitro-http.log 2>&1 &
          echo $! > /tmp/invitro-http.pid
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8080/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/invitro-http.log
          exit 1

      - name: Run desktop mobile and full browser journeys
        id: e2e
        continue-on-error: true
        env:
          BASE_URL: http://127.0.0.1:8080/
        run: node qa-e2e.mjs

      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: |
            qa-success-*.png
            qa-fail-*.png
          if-no-files-found: ignore

      - name: Publish machine-readable QA result
        if: always()
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        run: |
          mkdir -p qa-results/latest
          rm -f qa-results/latest/*.png qa-results/latest/status.json
          cp qa-success-*.png qa-results/latest/ 2>/dev/null || true
          cp qa-fail-*.png qa-results/latest/ 2>/dev/null || true
          python3 - <<'PY'
          import json, os, glob, datetime
          data = {
            "source_commit": os.environ["GITHUB_SHA"],
            "run_id": int(os.environ["GITHUB_RUN_ID"]),
            "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
            "outcome": os.environ.get("E2E_OUTCOME", "unknown"),
            "generated_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "screenshots": [os.path.basename(x) for x in sorted(glob.glob("qa-results/latest/*.png"))]
          }
          with open("qa-results/latest/status.json","w",encoding="utf-8") as f:
            json.dump(data,f,ensure_ascii=False,indent=2)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B qa-results
          git add -f qa-results/latest
          git commit -m "QA result for $GITHUB_SHA" || true
          git push --force origin qa-results

      - name: Fail workflow when E2E failed
        if: steps.e2e.outcome != 'success'
        run: exit 1
